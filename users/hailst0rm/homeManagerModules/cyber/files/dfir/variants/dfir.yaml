# vbox-build-flare-vm variant for the Windows-DFIR VM.
# Built by the `dfir-lab` wizard (see README), which runs
#   vbox-build-flare-vm ~/.config/dfir/variants/dfir.yaml --custom_config
# --custom_config makes the build pass config/dfir-config.xml to install.ps1;
# dfir-lab is what stages it as config.xml in the required-files dir.
VM_NAME: DFIR-Windows.testing
EXPORTED_VM_NAME: DFIR-Windows
SNAPSHOTS:
  - extension: ".dynamic"
    description: "Windows DFIR VM — Zimmerman + imaging (dfir-config.xml)"
    cmd: |
      # Flush the volume write cache before the abrupt shutdown. Built into
      # Windows (Win8+), so it does not depend on the sysinternals package.
      Write-VolumeCache C
